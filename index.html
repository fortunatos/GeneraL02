  <style>

    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 0;
      max-width: 100%;
    }

    html {
      min-height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;

      min-height: 100vh;
      min-height: 100dvh;

      overflow-x: hidden;
      overflow-y: auto;
    }

    /* PAGE */
    .page {
      width: 100%;
      min-width: 0;
      max-width: 100%;

      min-height: 100vh;
      min-height: 100dvh;

      display: grid;
      place-items: center;

      padding: 20px;
    }

    /* BACKGROUND */
    .bg {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background:
        radial-gradient(
          circle at top left,
          #ff4d6725,
          transparent 30%
        ),
        radial-gradient(
          circle at bottom right,
          #7c3aed25,
          transparent 30%
        ),
        #0b0b0b;

      z-index: -1;
      pointer-events: none;
    }

    /* CARD */
    .card {
      width: 100%;
      max-width: 420px;
      min-width: 0;

      background: #121212;

      border: 1px solid #262626;
      border-radius: 24px;

      padding: 40px 30px;

      text-align: center;

      box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
    }

    /* LOGO */
    .logo {
      font-size: 1.8rem;
      font-weight: bold;

      margin-bottom: 25px;

      letter-spacing: -0.5px;
    }

    .logo span {
      color: #ff4d67;
    }

    /* ICON */
    .icon {
      font-size: 58px;
      line-height: 1;

      margin-bottom: 20px;
    }

    /* TITLE */
    h1 {
      font-size: 2rem;
      line-height: 1.2;

      margin-bottom: 15px;
    }

    /* TEXT */
    p {
      color: #b3b3b3;

      line-height: 1.7;

      margin-bottom: 30px;
    }

    /* BUTTON CONTAINER */
    .buttons {
      width: 100%;
      min-width: 0;

      display: flex;
      flex-direction: column;

      gap: 15px;
    }

    /* BUTTON */
    .btn {
      display: block;

      width: 100%;
      min-width: 0;

      padding: 16px;

      border-radius: 14px;

      text-decoration: none;
      text-align: center;

      font-weight: bold;

      transition: .25s ease;
    }

    /* ENTER */
    .enter {
      background: linear-gradient(
        90deg,
        #ff4d67,
        #ff758c
      );

      color: white;

      box-shadow:
        0 10px 30px rgba(255, 77, 103, .25);
    }

    .enter:hover {
      transform: translateY(-2px);

      box-shadow:
        0 14px 35px rgba(255, 77, 103, .35);
    }

    /* EXIT */
    .exit {
      background: #1d1d1d;

      border: 1px solid #333;

      color: #ccc;
    }

    .exit:hover {
      background: #252525;
    }

    /* FOOTER */
    .footer {
      margin-top: 25px;

      color: #666;

      font-size: .85rem;

      line-height: 1.5;
    }

    /* CELULAR */
    @media (max-width: 480px) {

      .page {
        padding: 15px;
      }

      .card {
        padding: 32px 22px;
        border-radius: 20px;
      }

      .logo {
        font-size: 1.6rem;
      }

      .icon {
        font-size: 52px;
      }

      h1 {
        font-size: 1.7rem;
      }

    }

  </style>

</head>

<body>

  <div class="bg"></div>

  <div class="page">

    <main class="card">

      <div class="logo">
        AMeet<span>Me</span>
      </div>

      <div class="icon">
        ❤️
      </div>

      <h1>
        Meet Someone New
      </h1>

      <p>
        Discover new people, make connections and find someone special.
        AMeetMe is a dating and meeting platform for adults.
      </p>

      <div class="buttons">

        <a href="go.html" class="btn enter">
          I'm 18+ — Continue
        </a>

        <a href="go.html" class="btn exit">
          Exit
        </a>

      </div>

      <div class="footer">
        You must be 18 years or older to access this website.
        By continuing, you confirm that you meet the legal age requirement.
      </div>

    </main>

  </div>

</body>

</html>
